<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>PaperVault — 沉淀</title>
    <link rel="stylesheet" href="_shared.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="monogram">PV</div>
          <div>
            <h1>PaperVault</h1>
            <small>论文智库</small>
          </div>
        </div>
        <div class="nav-btn">◇ 论文库</div>
        <div class="nav-btn">◇ 写作思路</div>
        <div class="nav-btn">◇ 实验对比</div>
        <div class="nav-btn active">◆ 沉淀</div>
      </aside>
      <div class="full-main">
        <div class="section-title">沉淀</div>
        <div class="section-desc">接着读 · 开放问题池 · 选题本 · 积累统计</div>
        <div class="grid-2">
          <div class="card">
            <h4>开放问题池 · 全库</h4>
            <p style="color: #b3aea4; font-size: 12px; margin-bottom: 8px">
              ▸ 长上下文下如何可验证地缓解位置偏差？<span style="color: #8a857b">（4 篇出处）</span>
            </p>
            <p style="color: #b3aea4; font-size: 12px">
              ▸ 检索增强与自反思如何分工？<span style="color: #8a857b">（3 篇）</span>
            </p>
            <span class="btn-primary" style="margin-top: 10px; display: inline-block">生成选题</span>
          </div>
          <div class="card">
            <h4>选题本</h4>
            <p style="color: #b3aea4; font-size: 12px; margin-bottom: 6px">
              <strong style="color: #abd3bc">在推进</strong> · 位置感知 chunk 重排的最小消融
            </p>
            <p style="color: #8a857b; font-size: 11px">假设 / 最小实验 / 反证条件 · 挂接问题 #12</p>
          </div>
        </div>
        <div class="grid-2" style="margin-top: 14px">
          <div class="stat">
            <div style="color: #8a857b; font-size: 11px">笔记总字数</div>
            <b>428k</b>
          </div>
          <div class="stat">
            <div style="color: #8a857b; font-size: 11px">实验画像覆盖率</div>
            <b>76%</b>
          </div>
          <div class="stat">
            <div style="color: #8a857b; font-size: 11px">本周入库</div>
            <b>5</b>
          </div>
          <div class="stat">
            <div style="color: #8a857b; font-size: 11px">高频标签</div>
            <b style="font-size: 14px">RAG · Agent</b>
          </div>
        </div>
      </div>
    </div>
    <div class="caption">界面示意 · 沉淀页</div>
  </body>
</html>
